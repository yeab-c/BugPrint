[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugprint"
version = "0.1.0"
description = "Development flight recorder: watches test runs, uses Decider to classify events, Bedrock to write reports."
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
authors = [
    {name = "BugPrint Team"},
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "strands-agents>=0.1",
    "strands-agents-tools>=0.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "strands-decider>=0.1",
]
dashboard = [
    "streamlit>=1.37",
    "pandas>=2.2",
]

[project.scripts]
bugprint = "bugprint.cli:app"

[project.entry-points."pytest11"]
bugprint = "bugprint.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
